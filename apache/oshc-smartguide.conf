<VirtualHost *:80>
 ServerName oshc-smartguide.local
 DocumentRoot /var/www/oshc-smartguide
 <Directory /var/www/oshc-smartguide>
  Require all granted
  AllowOverride All
 </Directory>
 ProxyPreserveHost On
 ProxyPass /api http://127.0.0.1:8080/api
 ProxyPassReverse /api http://127.0.0.1:8080/api
 RewriteEngine On
 RewriteCond %{REQUEST_URI} !^/api
 RewriteCond %{REQUEST_FILENAME} !-f
 RewriteRule ^ /index.html [L]
</VirtualHost>
