server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/oshc;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
Fixes a Hibernate/H2 SQLFeatureNotSupportedException ("createClob") that
# surfaces as a generic 500 error whenever a @Lob CLOB field (data_tokens.ciphertext,
# users.photoData) is written -- e.g. tokenizing an MFA secret or saving a photo.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# SMTP settings. Set these environment variables before starting the backend.
# Example for Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# AES-GCM tokenization key. Set TOKENIZATION_KEY in production.
app.tokenization-key=${TOKENIZATION_KEY:change-this-development-key}
